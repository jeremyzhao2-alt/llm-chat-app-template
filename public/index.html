<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Workers AI</title>
		<style>
			:root {
				--primary-color: #ffffff;
				--primary-hover: #e0e0e0;
				--bg-color: #000000;
				--glass-bg: rgba(255, 255, 255, 0.05);
				--glass-border: rgba(255, 255, 255, 0.12);
				--glass-shine: rgba(255, 255, 255, 0.06);
				--text-color: #ffffff;
				--text-light: #888888;
				--user-msg-bg: rgba(255, 255, 255, 0.95);
				--user-msg-text: #000000;
				--assistant-msg-bg: rgba(255, 255, 255, 0.07);
				--input-bg: rgba(255, 255, 255, 0.06);
				--send-btn-text: #000000;
				--typing-color: #666666;
			}

			@media (prefers-color-scheme: light) {
				:root {
					--primary-color: #000000;
					--primary-hover: #222222;
					--bg-color: #f0f0f0;
					--glass-bg: rgba(255, 255, 255, 0.45);
					--glass-border: rgba(0, 0, 0, 0.08);
					--glass-shine: rgba(255, 255, 255, 0.6);
					--text-color: #000000;
					--text-light: #666666;
					--user-msg-bg: rgba(0, 0, 0, 0.9);
					--user-msg-text: #ffffff;
					--assistant-msg-bg: rgba(255, 255, 255, 0.5);
					--input-bg: rgba(255, 255, 255, 0.5);
					--send-btn-text: #ffffff;
					--typing-color: #999999;
				}
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			textarea, input {
				-webkit-appearance: none !important;
				-moz-appearance: none !important;
				appearance: none !important;
			}

			::-webkit-resizer,
			::-webkit-inner-spin-button,
			::-webkit-outer-spin-button {
				display: none !important;
				-webkit-appearance: none !important;
				margin: 0 !important;
			}

			html, body {
				height: 100%;
				overflow: hidden;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				line-height: 1.4;
				color: var(--text-color);
				background: var(--bg-color);
				display: flex;
				flex-direction: column;
			}

			/* Subtle animated background orbs for glass refraction — pure CSS, no JS */
			body::before,
			body::after {
				content: '';
				position: fixed;
				border-radius: 50%;
				filter: blur(100px);
				opacity: 0.3;
				z-index: 0;
				will-change: transform;
				pointer-events: none;
			}

			body::before {
				width: 500px;
				height: 500px;
				background: #222;
				top: -150px;
				right: -100px;
				animation: drift1 20s ease-in-out infinite alternate;
			}

			body::after {
				width: 400px;
				height: 400px;
				background: #333;
				bottom: -100px;
				left: -100px;
				animation: drift2 25s ease-in-out infinite alternate;
			}

			@media (prefers-color-scheme: light) {
				body::before {
					background: #c0c0c0;
					opacity: 0.5;
				}
				body::after {
					background: #d0d0d0;
					opacity: 0.4;
				}
			}

			@keyframes drift1 {
				0% { transform: translate(0, 0) scale(1); }
				100% { transform: translate(-80px, 80px) scale(1.15); }
			}

			@keyframes drift2 {
				0% { transform: translate(0, 0) scale(1); }
				100% { transform: translate(60px, -60px) scale(1.1); }
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				width: 100%;
				height: 100%;
				position: relative;
				z-index: 1;
				background: var(--glass-bg);
				backdrop-filter: blur(40px) saturate(130%) brightness(1.05);
				-webkit-backdrop-filter: blur(40px) saturate(130%) brightness(1.05);
				border: 1px solid var(--glass-border);
				overflow: hidden;
				/* Liquid glass inner highlight */
				box-shadow:
					inset 0 1px 0 0 var(--glass-shine),
					inset 0 -1px 0 0 rgba(0, 0, 0, 0.1);
			}

			/* Top glass reflection bar */
			.chat-container::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 50%;
				background: linear-gradient(
					180deg,
					var(--glass-shine) 0%,
					transparent 100%
				);
				pointer-events: none;
				z-index: 0;
			}

			.chat-header {
				text-align: center;
				padding: 1rem 1rem 0.6rem;
				position: relative;
				z-index: 1;
				border-bottom: 1px solid var(--glass-border);
				background: var(--glass-bg);
				backdrop-filter: blur(20px);
				-webkit-backdrop-filter: blur(20px);
			}

			.chat-header h1 {
				font-size: 1.4rem;
				color: var(--text-color);
				font-weight: 700;
				letter-spacing: -0.025em;
			}

			.chat-header p {
				color: var(--text-light);
				font-size: 0.8rem;
				margin-top: 0.15rem;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1.2rem;
				display: flex;
				flex-direction: column;
				gap: 0.8rem;
				position: relative;
				z-index: 1;
			}

			/* Minimal scrollbar */
			.chat-messages::-webkit-scrollbar {
				width: 4px;
			}

			.chat-messages::-webkit-scrollbar-track {
				background: transparent;
			}

			.chat-messages::-webkit-scrollbar-thumb {
				background: rgba(128, 128, 128, 0.3);
				border-radius: 4px;
			}

			.message {
				padding: 0.7rem 1.1rem;
				border-radius: 18px;
				max-width: 85%;
				position: relative;
			}

			.message p {
				white-space: pre-wrap;
				margin: 0;
				overflow-wrap: anywhere;
				font-size: 0.95rem;
			}

			.user-message {
				background-color: var(--user-msg-bg);
				align-self: flex-end;
				border-bottom-right-radius: 4px;
			}

			.user-message p {
				color: var(--user-msg-text);
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
				border-bottom-left-radius: 4px;
				border: 1px solid var(--glass-border);
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
			}

			.assistant-message p {
				color: var(--text-color);
			}

			.message-input {
				display: flex;
				align-items: center;
				padding: 1rem 1.2rem;
				gap: 0.8rem;
				background: var(--glass-bg);
				border-top: 1px solid var(--glass-border);
				backdrop-filter: blur(20px);
				-webkit-backdrop-filter: blur(20px);
				position: relative;
				z-index: 1;
			}

			#user-input {
				flex: 1;
				padding: 0.75rem 1.1rem;
				background-color: var(--input-bg);
				border: 1px solid var(--glass-border);
				border-radius: 16px;
				color: var(--text-color);
				font-family: inherit;
				font-size: 0.95rem;
				resize: none !important;
				min-height: 44px;
				max-height: 150px;
				outline: none;
				transition: border-color 0.2s;
				overflow: hidden;
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
			}

			#user-input::placeholder {
				color: var(--text-light);
			}

			#user-input:focus {
				border-color: var(--primary-color);
			}

			#send-button {
				width: 44px;
				height: 44px;
				background-color: var(--primary-color);
				color: var(--send-btn-text);
				border: none;
				border-radius: 14px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
				flex-shrink: 0;
			}

			#send-button:hover {
				background-color: var(--primary-hover);
				transform: scale(1.05);
			}

			#send-button:disabled {
				opacity: 0.3;
				cursor: not-allowed;
				transform: none;
			}

			.typing-indicator {
				display: none;
				font-size: 0.8rem;
				font-style: italic;
				color: var(--typing-color);
				padding: 0.4rem 1.2rem;
				position: relative;
				z-index: 1;
			}

			.typing-indicator.visible {
				display: block;
			}

			/* Safe area for mobile notches */
			@supports (padding: env(safe-area-inset-bottom)) {
				.message-input {
					padding-bottom: calc(1rem + env(safe-area-inset-bottom));
				}
			}
		</style>
	</head>
	<body>
		<div class="chat-container">
			<div class="chat-header">
				<h1>Cloudflare AI 助手</h1>
				<p>基于 Cloudflare Workers AI 构建</p>
			</div>

			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>你好！我是基于 Cloudflare Workers AI 的聊天应用。今天有什么我可以帮你的吗？</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI 正在思考中...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="输入消息并按 Enter 发送..."
					rows="1"
					autofocus
				></textarea>
				<button id="send-button" title="发送">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<line x1="22" y1="2" x2="11" y2="13"></line>
						<polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
					</svg>
				</button>
			</div>
		</div>

		<script src="chat.js"></script>
	</body>
</html>
