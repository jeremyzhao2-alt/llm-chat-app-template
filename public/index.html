<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Workers AI</title>
		<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='12' rx='3'/><line x1='9' y1='20' x2='9' y2='16'/><line x1='15' y1='20' x2='15' y2='16'/><line x1='6' y1='20' x2='18' y2='20'/><circle cx='9' cy='10' r='1.2' fill='%23888' stroke='none'/><circle cx='15' cy='10' r='1.2' fill='%23888' stroke='none'/></svg>" />
		<script>
			var h=document.documentElement,s=localStorage.getItem('theme');
			if(s==='light')h.classList.add('light');
			else if(!s&&matchMedia('(prefers-color-scheme:light)').matches)h.classList.add('light');
			matchMedia('(prefers-color-scheme:light)').addEventListener('change',function(e){
				if(!localStorage.getItem('theme')){if(e.matches)h.classList.add('light');else h.classList.remove('light')}
			});
		</script>
		<style>
			*{box-sizing:border-box;margin:0;padding:0}
			textarea,input{-webkit-appearance:none!important;appearance:none!important}
			::-webkit-resizer{display:none!important}
			html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}

			:root{
				--g:rgba(255,255,255,.03);--gs:rgba(255,255,255,.06);
				--gb:rgba(255,255,255,.08);--gbs:rgba(255,255,255,.15);
				--sh:rgba(255,255,255,.04);--sht:rgba(255,255,255,.08);
				--rf:rgba(255,255,255,.02);--tc:#fff;--tl:#777;
				--ub:rgba(255,255,255,.92);--ut:#000;
				--ab:rgba(255,255,255,.05);--ib:rgba(255,255,255,.04);
				--pc:#fff;--ph:#d0d0d0;--st:#000;--bg:#050505;
				--o1:#1a1a2e;--o2:#16213e;--o3:#0f0f1a;
				--oo1:.6;--oo2:.5;--oo3:.4;
				--tb:rgba(255,255,255,.08);--ti:rgba(255,255,255,.12)
			}
			html.light{
				--g:rgba(255,255,255,.35);--gs:rgba(255,255,255,.5);
				--gb:rgba(255,255,255,.5);--gbs:rgba(255,255,255,.7);
				--sh:rgba(255,255,255,.5);--sht:rgba(255,255,255,.7);
				--rf:rgba(255,255,255,.25);--tc:#000;--tl:#666;
				--ub:rgba(0,0,0,.85);--ut:#fff;
				--ab:rgba(255,255,255,.45);--ib:rgba(255,255,255,.4);
				--pc:#000;--ph:#333;--st:#fff;--bg:#e8e8ed;
				--o1:#b8c6db;--o2:#c9b8db;--o3:#b8dbc6;
				--oo1:.8;--oo2:.7;--oo3:.6;
				--tb:rgba(0,0,0,.06);--ti:rgba(0,0,0,.1)
			}

			body{
				font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
				line-height:1.4;color:var(--tc);background:var(--bg);
				display:flex;flex-direction:column;position:relative
			}

			.o{position:fixed;border-radius:50%;pointer-events:none;z-index:0;contain:layout style paint}
			.o1{width:450px;height:450px;background:var(--o1);opacity:var(--oo1);top:-10%;right:-5%;filter:blur(80px);animation:d1 22s ease-in-out infinite alternate}
			.o2{width:350px;height:350px;background:var(--o2);opacity:var(--oo2);bottom:-5%;left:-8%;filter:blur(90px);animation:d2 28s ease-in-out infinite alternate}
			.o3{width:280px;height:280px;background:var(--o3);opacity:var(--oo3);top:40%;left:50%;filter:blur(100px);animation:d3 18s ease-in-out infinite alternate}
			@keyframes d1{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-40px,60px,0) scale(1.1)}to{transform:translate3d(-80px,30px,0) scale(1.05)}}
			@keyframes d2{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(50px,-40px,0) scale(1.15)}to{transform:translate3d(30px,-70px,0) scale(1.05)}}
			@keyframes d3{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-30px,30px,0) scale(1.2)}to{transform:translate3d(20px,-20px,0) scale(.95)}}

			.theme-toggle{
				position:fixed;top:.8rem;right:.8rem;z-index:10;width:40px;height:40px;
				border:1px solid var(--ti);border-radius:12px;background:var(--tb);
				backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
				cursor:pointer;display:flex;align-items:center;justify-content:center;
				color:var(--tc);box-shadow:inset 0 1px 0 0 var(--sh);
				transition:transform .2s;-webkit-tap-highlight-color:transparent;
				touch-action:manipulation;user-select:none;-webkit-user-select:none
			}
			.theme-toggle:hover{transform:scale(1.08)}
			.theme-toggle:active{transform:scale(.95)}
			.theme-toggle svg{width:20px;height:20px;position:absolute;transition:opacity .3s,transform .3s}
			.theme-toggle .icon-sun{opacity:1;transform:rotate(0) scale(1)}
			.theme-toggle .icon-moon{opacity:0;transform:rotate(-90deg) scale(.5)}
			html.light .theme-toggle .icon-sun{opacity:0;transform:rotate(90deg) scale(.5)}
			html.light .theme-toggle .icon-moon{opacity:1;transform:rotate(0) scale(1)}

			.chat-container{
				display:flex;flex-direction:column;width:100%;height:100%;
				position:relative;z-index:1;background:var(--g);
				backdrop-filter:blur(60px) saturate(140%) brightness(1.02);
				-webkit-backdrop-filter:blur(60px) saturate(140%) brightness(1.02);
				border:1px solid var(--gb);overflow:hidden;
				box-shadow:inset 0 1px 0 0 var(--sht),inset 0 -1px 0 0 rgba(0,0,0,.05),inset 1px 0 0 0 var(--sh),inset -1px 0 0 0 var(--sh)
			}
			.chat-container::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,var(--sht) 0%,var(--rf) 30%,transparent);pointer-events:none;z-index:0}
			.chat-container::after{content:'';position:absolute;top:0;left:0;bottom:0;width:40%;background:linear-gradient(90deg,var(--rf) 0%,transparent);pointer-events:none;z-index:0}

			.chat-messages{
				flex:1;overflow-y:auto;padding:1.2rem;display:flex;
				flex-direction:column;gap:.8rem;position:relative;z-index:1;
				scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.2) transparent;
				-webkit-overflow-scrolling:touch;overscroll-behavior:contain
			}
			.chat-messages::-webkit-scrollbar{width:3px}
			.chat-messages::-webkit-scrollbar-track{background:0 0}
			.chat-messages::-webkit-scrollbar-thumb{background:rgba(128,128,128,.2);border-radius:3px}

			.message{padding:.7rem 1.1rem;border-radius:20px;max-width:85%;position:relative}
			.message p{white-space:pre-wrap;margin:0;overflow-wrap:anywhere;font-size:clamp(.875rem,.9rem + .1vw,.95rem)}
			.user-message{background:var(--ub);align-self:flex-end;border-bottom-right-radius:6px}
			.user-message p{color:var(--ut)}
			.assistant-message{
				background:var(--ab);align-self:flex-start;border-bottom-left-radius:6px;
				border:1px solid var(--gb);backdrop-filter:blur(20px) saturate(120%);
				-webkit-backdrop-filter:blur(20px) saturate(120%);
				box-shadow:inset 0 1px 0 0 var(--sh)
			}
			.assistant-message p{color:var(--tc)}

			.message-input{
				display:flex;align-items:center;padding:1rem;gap:.6rem;
				background:var(--gs);border-top:1px solid var(--gbs);
				backdrop-filter:blur(40px) saturate(130%);
				-webkit-backdrop-filter:blur(40px) saturate(130%);
				position:relative;z-index:2;box-shadow:inset 0 1px 0 0 var(--sh);
				flex-shrink:0
			}

			.input-wrapper{
				flex:1;display:flex;align-items:center;background:var(--ib);
				border:1px solid var(--gbs);border-radius:18px;padding:0 .5rem 0 0;
				backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
				box-shadow:inset 0 1px 0 0 var(--sh);overflow:hidden;
				transition:border-color .2s
			}
			.input-wrapper:focus-within{border-color:var(--pc)}

			#user-input{
				flex:1;padding:.75rem 1rem;background:0 0;border:none;
				color:var(--tc);font-family:inherit;font-size:.95rem;
				resize:none!important;min-height:44px;max-height:150px;
				outline:0;overflow:hidden;touch-action:manipulation
			}
			#user-input::placeholder{color:var(--tl)}

			.ai-icon{
				width:32px;height:32px;flex-shrink:0;display:flex;
				align-items:center;justify-content:center;border-radius:10px;
				background:var(--gs);border:1px solid var(--gb)
			}
			.ai-icon svg{width:18px;height:18px;opacity:.5}

			#send-button{
				width:44px;height:44px;background:var(--pc);color:var(--st);
				border:none;border-radius:16px;cursor:pointer;display:flex;
				align-items:center;justify-content:center;flex-shrink:0;
				transition:background .2s,transform .2s;
				-webkit-tap-highlight-color:transparent;touch-action:manipulation
			}
			#send-button:hover{background:var(--ph);transform:scale(1.05)}
			#send-button:disabled{opacity:.3;cursor:not-allowed;transform:none}

			.typing-indicator{display:none;font-size:.8rem;font-style:italic;color:var(--tl);padding:.4rem 1.2rem;position:relative;z-index:1}
			.typing-indicator.visible{display:block}

			@supports(padding:env(safe-area-inset-bottom)){
				.message-input{padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
			}

			@media(max-width:480px){
				.message{max-width:90%;padding:.6rem .9rem}
				.chat-messages{padding:.8rem;gap:.6rem}
				.message-input{padding:.6rem}
			}

			@media(max-height:500px){
				.chat-messages{padding:.6rem}
				.message-input{padding:.5rem}
			}
		</style>
	</head>
	<body>
		<div class="o o1"></div>
		<div class="o o2"></div>
		<div class="o o3"></div>

		<button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
			<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
			<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
		</button>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>你好！今天有什么我可以帮你的吗？</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI 正在思考中...
			</div>

			<div class="message-input">
				<div class="input-wrapper">
					<textarea id="user-input" placeholder="输入消息..." rows="1" autofocus></textarea>
					<div class="ai-icon">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="3"/><line x1="9" y1="20" x2="9" y2="16"/><line x1="15" y1="20" x2="15" y2="16"/><line x1="6" y1="20" x2="18" y2="20"/><circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
					</div>
				</div>
				<button id="send-button" title="发送">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
				</button>
			</div>
		</div>

		<script>
		(function(){
			var t=document.getElementById('theme-toggle');
			t.addEventListener('mousedown',function(e){e.preventDefault()});
			t.addEventListener('touchend',function(e){
				e.preventDefault();
				document.documentElement.classList.toggle('light');
				localStorage.setItem('theme',document.documentElement.classList.contains('light')?'light':'dark');
				t.blur();
			});
			t.addEventListener('click',function(e){
				e.preventDefault();
				document.documentElement.classList.toggle('light');
				localStorage.setItem('theme',document.documentElement.classList.contains('light')?'light':'dark');
				t.blur();
			});
			if(window.visualViewport){
				var c=document.querySelector('.chat-container'),m=document.getElementById('chat-messages');
				window.visualViewport.addEventListener('resize',function(){
					c.style.height=window.visualViewport.height+'px';
					m.scrollTop=m.scrollHeight;
				});
			}
		})();
		</script>
		<script src="chat.js"></script>
	</body>
</html>
